<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMPress</title>
<link rel="stylesheet" href="{{THEME_URI}}/assets/app.css">
</head>
<body>
<header class="site-header">
	<a class="site-title" href="{{SITE_PATH}}">DMPress</a>
	<p class="site-tagline">A headless starter theme, rendered entirely from the REST API.</p>
	<nav class="site-nav" id="category-nav" aria-label="Categories" hidden></nav>
</header>

<main id="app" aria-live="polite">
	<p class="state">Loading…</p>
</main>

<footer class="site-footer">
	<p>Served by DMPress. Content fetched from <code id="rest-base">the REST API</code>.</p>
</footer>

<script>
	/* Substituted by DMPress when this theme is served. Lets the app route
	   correctly when the install lives in a subdirectory. */
	window.DMPRESS = { base: '{{SITE_PATH}}' };
</script>
<script src="{{THEME_URI}}/assets/app.js"></script>
</body>
</html>
